# Optional: system-wide cap so no app can boost volume above 100%.
# Install:
#   mkdir -p ~/.config/pipewire/pipewire-pulse.conf.d
#   cp pipewire-max-volume.conf ~/.config/pipewire/pipewire-pulse.conf.d/50-max-volume.conf
# Then restart PipeWire (re-login or: systemctl --user restart wireplumber pipewire pipewire-pulse)

stream.properties = {
    channelmix.max-volume = 1.0
    channelmix.min-volume = 0.0
}
